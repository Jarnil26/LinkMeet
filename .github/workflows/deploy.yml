name: Build and Push to ACR
on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Image tag to build'
        required: true
      acrName:
        description: 'ACR Name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and Push
        run: |
          az acr build --registry ${{ github.event.inputs.acrName }} --image ${{ github.event.inputs.imageTag }} .